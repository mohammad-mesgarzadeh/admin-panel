<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminPanel</title>
    <link rel="stylesheet" href="styles/output.css">
    <link rel="stylesheet" href="adminPanel.html">

</head>

<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">

    <div class="fixed inset-0 z-0">
            <canvas id="particleCanvas"></canvas>
        <div class="absolute inset-0 "></div>
    </div>

    <div
        class="relative z-10 w-full max-w-md p-8 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight">Admin Panel</h1>
            <p class="text-gray-500 mt-2">Please sign in to continue</p>
        </div>

        <p class="m-4 hidden text-center" id="errorMessage" style="color:red;"></p>


        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="username"
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                        placeholder="Enter username" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password"
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                        placeholder="Enter password" required>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" class="mr-2 rounded text-indigo-600 focus:ring-indigo-500">
                    Remember me
                </label>
                <a href="#" class="text-indigo-600 hover:text-indigo-800 font-medium">Forgot password?</a>
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer"
                id="button">
                Log In
            </button>

            <p id="error-msg" class="text-red-500 text-center text-sm mt-2 hidden">Invalid credentials!</p>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            <p>Credentials: admin / admin</p>
        </div>

        <script src="app.js"></script>
</body>

</html>
